<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="{% block meta_desc %}Personal Data Science and Python mini-projects portfolio.{% endblock %}" />
  <title>{% block title %}My Mini Projects{% endblock %}</title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Font Awesome icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />

  {% block extra_head %}{% endblock %}
</head>
<body>

  <!-- ── Navigation ──────────────────────────────────────────────────────── -->
  <nav class="navbar" id="navbar">
    <div class="nav-container">

      <a href="/" class="nav-brand">
        <span class="brand-icon"><i class="fa-solid fa-code"></i></span>
        <span class="brand-text">Mini<span class="accent">Projects</span></span>
      </a>

      <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>

      <ul class="nav-links" id="navLinks">
        <li><a href="/" class="nav-link {% if request.path == '/' %}active{% endif %}">Home</a></li>
        <li><a href="/#projects" class="nav-link">Projects</a></li>
        <li><a href="/#about" class="nav-link">About</a></li>
      </ul>

    </div>
  </nav>

  <!-- ── Page Content ────────────────────────────────────────────────────── -->
  <main>
    {% block content %}{% endblock %}
  </main>

  <!-- ── Footer ──────────────────────────────────────────────────────────── -->
  <footer class="footer">
    <div class="footer-container">
      <div class="footer-brand">
        <span class="brand-icon"><i class="fa-solid fa-code"></i></span>
        <span>MiniProjects</span>
      </div>
      <p class="footer-tagline">Building to learn. Learning to build.</p>
      <div class="footer-stack">
        <span class="tech-pill">Python</span>
        <span class="tech-pill">Flask</span>
        <span class="tech-pill">Pandas</span>
        <span class="tech-pill">Scikit-learn</span>
        <span class="tech-pill">Jupyter</span>
      </div>
      <p class="footer-copy">&copy; 2024 Mini Projects Portfolio</p>
    </div>
  </footer>

  <!-- ── Shared JS ────────────────────────────────────────────────────────── -->
  <script>
    // Navbar scroll effect
    const navbar = document.getElementById('navbar');
    window.addEventListener('scroll', () => {
      navbar.classList.toggle('scrolled', window.scrollY > 40);
    });

    // Mobile toggle
    const navToggle = document.getElementById('navToggle');
    const navLinks  = document.getElementById('navLinks');
    navToggle.addEventListener('click', () => {
      navLinks.classList.toggle('open');
      navToggle.classList.toggle('open');
    });
  </script>

  {% block extra_js %}{% endblock %}
</body>
</html>
